name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Created on this commit if missing."
        required: true
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            asset: cc-linux-x64
            archive: tar.gz
          - target: aarch64-linux-musl
            asset: cc-linux-arm64
            archive: tar.gz
          - target: x86_64-macos
            asset: cc-darwin-x64
            archive: tar.gz
          - target: aarch64-macos
            asset: cc-darwin-arm64
            archive: tar.gz
          - target: x86_64-windows
            asset: cc-windows-x64
            archive: zip
          - target: aarch64-windows
            asset: cc-windows-arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Package
        run: ./scripts/package-release.sh ${{ matrix.target }} ${{ matrix.asset }} ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}.${{ matrix.archive }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installers
        run: |
          chmod +x install
          cp install install.ps1 dist/
          (cd dist && sha256sum cc-*.tar.gz cc-*.zip install install.ps1 > SHA256SUMS)
          ls -la dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Install:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install | bash
          \`\`\`

          \`\`\`powershell
          irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
          \`\`\`

          Then set \`CURSOR_API_KEY\` and run \`cc\`.
          EOF
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then
            extra+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file "$notes" \
              --generate-notes \
              "${extra[@]}"
          fi
